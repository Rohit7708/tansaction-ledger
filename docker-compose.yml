services:
  postgres:
    image: postgres:16-alpine
    container_name: account-transaction-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: account_transactions
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the separate test database on first start.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d account_transactions']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
